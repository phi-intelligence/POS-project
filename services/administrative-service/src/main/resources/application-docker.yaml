server:
  port: 8082

spring:
  config:
    activate:
      on-profile: docker

  application:
    name: administrative-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:pos}
    username: ${DB_USERNAME:pos}
    password: ${DB_PASSWORD:pos}

  jpa:
    properties:
      hibernate:
        default_schema: administrative

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
