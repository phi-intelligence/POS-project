server:
  port: 8081

spring:
  config:
    activate:
      on-profile: docker

  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:pos}
    username: ${DB_USERNAME:pos}
    password: ${DB_PASSWORD:pos}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: identity

  flyway:
    enabled: true
    schemas: identity
    locations: classpath:db/migrations

jwt:
  secret: ${JWT_SECRET:change-me-identity-jwt-secret-32-bytes-minimum-123456}
  access-token-seconds: 900
  refresh-token-seconds: 1209600

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

bootstrap:
  breakglass:
    enabled: true
    token: ${BOOTSTRAP_BREAKGLASS_TOKEN:d3b7c4b1-9f0a-4f52-a9d2-8c0f4f1a7c93}
    trust-forwarded-for: true
