version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pos-postgres
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pos-redis
    ports:
      - "6379:6379"

  identity-service:
    build: ./services/identity-service
    container_name: pos-identity-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      JWT_SECRET: "this-is-a-very-long-random-jwt-secret-key-at-least-32-bytes-long-123456"
      SPRING_PROFILES_ACTIVE: docker
      BOOTSTRAP_BREAKGLASS_ENABLED: "true"
      BOOTSTRAP_BREAKGLASS_TOKEN: "d3b7c4b1-9f0a-4f52-a9d2-8c0f4f1a7c93"
    ports:
      - "8081:8081"

  administrative-service:
    build: ./services/administrative-service
    container_name: pos-administrative-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"

  payer-service:
    build: ./services/payer-service
    container_name: pos-payer-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"

  obligation-service:
    build: ./services/obligation-service
    container_name: pos-obligation-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"

  payment-service:
    build: ./services/payment-service
    container_name: pos-payment-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"

  device-service:
    build: ./services/device-service
    container_name: pos-device-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8086:8086"

  enforcement-service:
    build: ./services/enforcement-service
    container_name: pos-enforcement-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8087:8087"

  reporting-service:
    build: ./services/reporting-service
    container_name: pos-reporting-service
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pos
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8088"

  notification-service:
    build: ./services/notification-service
    container_name: pos-notification-service
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8089:8089"

volumes:
  db-data:

